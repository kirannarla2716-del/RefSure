name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            test/security/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: flutter pub get
      - name: Analyze the full application for compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter analyze lib/main.dart lib/firebase_options.dart lib/services/trusted_application_service.dart
      - run: flutter test
      - name: Build production-equivalent web release
        run: >
          flutter build web --release
          --dart-define=REFSURE_ENV=production
          --dart-define=ENABLE_FIREBASE_APP_CHECK=true
          --dart-define=FIREBASE_APP_CHECK_WEB_KEY=ci-app-check-site-key

      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Compile Functions production entrypoint
        working-directory: functions
        run: >
          npm exec -- tsc
          --module commonjs
          --moduleResolution node
          --target es2022
          --strict
          --esModuleInterop
          --skipLibCheck
          --sourceMap
          --outDir lib
          --rootDir src
          src/index.ts

      - run: npm ci
        working-directory: test/security
      - run: npm test
        working-directory: test/security

      - run: npm ci
        working-directory: tools/migrations
      - run: npm test
        working-directory: tools/migrations
